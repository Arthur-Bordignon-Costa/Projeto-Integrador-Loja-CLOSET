<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/public/img/logo/icon.png" type="image/x-icon">
    <title>Produto — CLOSET</title>
    <link rel="stylesheet" href="/src/style/global.css">
    <link rel="stylesheet" href="/src/style/header.css">
    <link rel="stylesheet" href="/src/style/footer.css">
    <link rel="stylesheet" href="/src/style/produto.css">
</head>
<body>
    <div id="componentHeader"></div>
    <main class="detalheProduto">
        <a href="/catalogo.html" class="voltarCatalogo">← VOLTAR AO CATÁLOGO</a>
        <section id="produtoDetalhes" class="produtoDetalhes" aria-live="polite">
            <p id="estadoProduto" class="estadoProduto">Carregando produto...</p>
            <div id="galeriaProduto" class="galeriaProduto" hidden>
                <img id="imagemProduto" class="imagemProduto" alt="">
            </div>
            <div id="informacoesProduto" class="informacoesProduto" hidden>
                <span id="categoriaProduto" class="categoriaDetalhe"></span>
                <h1 id="nomeProduto"></h1>
                <p id="precoProduto" class="precoDetalhe"></p>
                <div class="descricaoProduto">
                    <h2>Sobre o produto</h2>
                    <p id="descricaoProduto"></p>
                </div>
                <div class="tamanhosProduto">
                    <h2>Variações disponíveis</h2>
                    <ul id="variacoesProduto" class="listaVariacoes"></ul>
                </div>
                <a id="btnInteresse" class="btnInteresse" href="#" target="_blank" rel="noopener noreferrer">
                    TENHO INTERESSE
                </a>
                <p class="avisoWhatsApp">Entre em contato para saber mais sobre este produto.</p>
            </div>
        </section>
    </main>
    <div id="componentFooter"></div>
    <script type="module" src="/src/components/components.js"></script>
    <script type="module" src="/src/js/pages/produto.js"></script>
</body>
</html>
